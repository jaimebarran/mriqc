type: rating-widget
id: qcrating
defaults:
  md5sum: unspecified
  dataset: 
  filename: 
  endpoint: "https://localhost:8000/"
  access_token: <secret_token>
settings:
  style: 'width: 30%; top: 100px; left: 65%;'
  navbar_label: Rating widget
  mintime: 10
components:
  slider:
    id: qcslider
    title: Overall Quality Rating
    collapse: false
    settings:
      step: '0.05'
      value: '2.5'
      min: '1.0'
      max: '4.0'
    options:
      - ['Exclude', 'danger']
      - ['Poor', 'warning']
      - ['Acceptable', 'primary']
      - ['Excellent', 'success']
  artifacts:
    id: qcartifacts
    title: Record specific artifacts
    collapse: true
    settings:
      type: checkbox
    options:
      head-motion: Head motion artifacts
      eye-motion: Eye motion artifacts
      inu: Intensity non-uniformity (B<sub>1</sub> bias)
      eyes-closed: Eyes closed
    extra:
      id: artifactsextra
      title: Extra artifacts
      collapsse: true
      components:
        - settings:
            label: Blurred image (contours)
            class: slider
            type: range
            step: '0.05'
            value: '2.0'
            min: '1.0'
            max: '3.0'
          options:
            - ['Low', 'primary']
            - ['Medium', 'warning']
            - ['High', 'danger']
        - settings:
            label: Noise level (low frequency)
            class: slider
            type: range
            step: '0.05'
            value: '2.0'
            min: '1.0'
            max: '3.0'
          options:
            - ['Low', 'primary']
            - ['Medium', 'warning']
            - ['High', 'danger']
  extra:
    id: qcextra
    title: Extra details
    collapse: true
    components:
      - settings:
          type: textarea
          label: Comments
      - settings:
          label: Rater confidence
          class: slider
          type: range
          step: '0.05'
          value: '3.5'
          min: '0.0'
          max: '4.0'
        options:
          - ['Doubtful', 'warning']
          - ['Confident', 'success bg-success text-white']
  actions:
    - id: btn-download
      href: ""
      text: Download
      type: anchor
      disabled: true
    - id: btn-post
      disabled: true
      type: button
      text: Share publicly
